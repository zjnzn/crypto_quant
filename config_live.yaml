# config_live.yaml
# 实盘交易配置模板
# 复制此文件为 config_live.yaml 并填入真实凭证

mode: live   # "backtest" | "paper" | "live"
             # paper = Binance testnet（不花真钱）
             # live  = Binance 真实环境

bus:
  backend: sync          # "sync"（单进程）| "kafka"（多进程）

cache:
  backend: memory         # "memory"（回测）| "redis"（生产）
  redis_host: localhost
  redis_port: 6379

execution:
  exchange: binance      # "paper" | "binance" | "okx"
  # api_key:    "LixBa8EOAsAt7yVTaOMAG9hy9aasjE1xcrFwm4nXJj5aDPspIv5MYR6XAv4DZP7f"
  # api_secret: "Uz9LXA82Byf9hhIFpjAs1nJJsWgtJIXgTnmDZHWt7rua4yeQSSNQVK7FzxwCo7Gv"
  api_key:    "xAhuEBwlfBN0PmY52XWDxrVisdf14O5voNyPCeJm4qPFUKUynGDlXjWejz4OBl1I"
  api_secret: "BpkKYp8lOwimo73LwzbpNHIEFpoJ8XSZKLfGaZPhFy72rNzD427sutBKnkxzax0Q"

account:
  main_id: main
  initial_usdt: 10.0  # 仅用于回测初始化，实盘从交易所拉取

risk:
  max_weight:       0.02    # 单标的保证金占用上限（leverage 提高 → 降低 max_weight 保持敞口不变）
  max_leverage:     100       # 全局最大杠杆（实盘建议保守）
  leverage:         100       # 目标杠杆倍数（用于仓位计算）
  max_drawdown:     0.05    # 5% 回撤熔断
  max_funding_rate: 0.003   # 0.3%/8h 资金费率上限
  order_cooldown:   5.0     # 同标的两次下单最小间隔（秒，防止重复下单）

  # ── 手续费保护框架 ─────────────────────────────────────────────────────
  min_rebalance_pct:       0.05    # 最小调仓量 5% NAV,低于此拒绝下单
  trading_cost_pct:        0.0006  # 币安永续手续费+滑点:0.04%+0.02%=0.06%
  profit_multiplier:       2.0     # 预期收益必须≥2×成本(安全系数)→阈值0.12%
  reversal_threshold:      0.50    # 翻仓最小信号强度,信号绝对值必须≥此值才允许翻仓
  min_score:               0.35    # 开仓最小信号强度,信号绝对值必须≥此值才开新仓

monitor:
  warn_drawdown:     0.03   # 3% 告警
  critical_drawdown: 0.05   # 5% 熔断

strategies:
  - module: "strategies.momentum.MomentumStrategy"
    params:
      window:    20
      scale:     0.002  # scale 随杠杆调整：0.0020/5=0.0004，保持信号-仓位映射不变
      min_score: 0.35    # 提高阈值：过滤弱信号，减少频繁交易

  # - module: "strategies.mean_reversion.MeanReversionStrategy"
