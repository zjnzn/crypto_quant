# config_live.yaml
# 实盘交易配置模板
# 复制此文件为 config_live.yaml 并填入真实凭证

mode: live   # "backtest" | "paper" | "live"
             # paper = Binance testnet（不花真钱）
             # live  = Binance 真实环境

bus:
  backend: sync          # "sync"（单进程）| "kafka"（多进程）

cache:
  backend: memory         # "memory"（回测）| "redis"（生产）
  redis_host: localhost
  redis_port: 6379

execution:
  exchange: binance      # "paper" | "binance" | "okx"
  # 实盘密钥不要写入配置文件。请通过环境变量注入：
  #   BINANCE_API_KEY
  #   BINANCE_API_SECRET
  api_key:    "xAhuEBwlfBN0PmY52XWDxrVisdf14O5voNyPCeJm4qPFUKUynGDlXjWejz4OBl1I"
  api_secret: "BpkKYp8lOwimo73LwzbpNHIEFpoJ8XSZKLfGaZPhFy72rNzD427sutBKnkxzax0Q"

account:
  main_id: main
  initial_usdt: 5000.0  # 仅用于回测初始化，实盘从交易所拉取

risk:
  max_weight:       0.005   # 单标的保证金占用上限（0.5%，20x杠杆=10%名义仓位）
  max_leverage:     20       # 全局最大杠杆
  leverage:         20       # 目标杠杆倍数（用于仓位计算）
  max_drawdown:     0.08    # 8% 回撤熔断
  max_funding_rate: 0.003   # 0.3%/8h 资金费率上限
  order_cooldown:   60.0     # 同标的两次下单最小间隔（秒）

  # ── 手续费保护框架 ─────────────────────────────────────────────────────
  min_rebalance_pct:       0.01    # 最小调仓量 1% NAV,低于此拒绝下单
  trading_cost_pct:        0.0006  # 币安永续手续费+滑点: 0.04%+0.02%=0.06%=0.0006
  profit_multiplier:       2.0     # 预期收益必须≥2×成本
  min_score:               0.35    # 开仓最小信号强度
  close_threshold:         0.15    # 平仓信号阈值

monitor:
  warn_drawdown:     0.05   # 3% 告警
  critical_drawdown: 0.08   # 5% 熔断

strategies:
  # 动量策略（BTC实盘推荐配置）
  # 使用线性回归斜率，适合逐笔成交数据
  - module: "strategies.momentum.MomentumStrategy"
    params:
      window_sec: 300         # 5分钟时间窗口
      slope_scale: 0.00002    # 斜率归一化基准（5分钟涨0.6%=满仓）

  # 均值回归策略（暂不启用，先观察动量策略表现）
  # 注意：MeanReversion当前基于成交笔数窗口，不适合aggTrade
  # 需要改造为时间窗口后再启用
  # - module: "strategies.mean_reversion.MeanReversionStrategy"
  #   params:
  #     window:        1800    # 需改为时间窗口（秒）
  #     z_entry:       2.2
  #     z_threshold:   4.0
  #     trend_filter:  false   # EMA基于笔数，暂时关闭
  #     use_returns:   true
